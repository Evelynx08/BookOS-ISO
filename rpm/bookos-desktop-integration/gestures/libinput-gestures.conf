# BookOS touchpad gestures (libinput-gestures)
# gdbus (glib2) en vez de qdbus6: el binario qdbus6 es de Arch y NO existe en
# Fedora — con qdbus6 cada gesto fallaba en silencio (visto en 0.6.1).

# Swipe threshold (0-100)
swipe_threshold 0

# Gestures
gesture swipe down 3 gdbus call --session --dest org.kde.kglobalaccel --object-path /component/kwin --method org.kde.kglobalaccel.Component.invokeShortcut MinimizeAll
gesture swipe up 3 gdbus call --session --dest org.kde.kglobalaccel --object-path /component/kwin --method org.kde.kglobalaccel.Component.invokeShortcut Expose
gesture swipe up 4 gdbus call --session --dest org.kde.kglobalaccel --object-path /component/kwin --method org.kde.kglobalaccel.Component.invokeShortcut Overview
gesture pinch in 4 gdbus call --session --dest org.kde.plasmashell --object-path /PlasmaShell --method org.kde.PlasmaShell.activateLauncherMenu
