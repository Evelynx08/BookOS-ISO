# Las apps BookOS (Tauri/WebKitGTK) crashean en Wayland con
# "Gdk Error 71 (Protocol error) dispatching to Wayland display":
# el renderizador DMABUF de WebKit falla con varios drivers (Intel Arc
# incluido). Deshabilitarlo usa la ruta estable sin perder aceleración web.
WEBKIT_DISABLE_DMABUF_RENDERER=1
